<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - DEE SALON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-background">

    <div id="preloader">
        <div class="preloader-button">DEESALON</div>
    </div>

    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="DEE SALON Logo" />
                <span>DEE SALON</span>
            </a>
            <button class="menu-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-menu"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h3 class="section-title">Get In Touch</h3>
                <div class="content-box">
                    <div style="text-align: center; margin-bottom: 40px;">
                        <p contenteditable="true"><strong>Address:</strong>TANKE ILORIN</p>
                        <p contenteditable="true"><strong>Email:</strong> dammytoyosi69@gmail.com</p>
                        <p contenteditable="true"><strong>Phone:</strong>+2349049144351</p>
                    </div>
                    <form class="contact-form" action="#" method="post">
                        <label for="service">Check our gallery to select an option</label>
                        <select name="service" id="service" required>
                            <option value="">--Please choose an option--</option>
                            <option value="precision-haircuts">Precision Haircuts</option>
                            <option value="expert-hair-coloring">Expert Hair Coloring</option>
                            <option value="luxury-hair-treatments">Luxury Hair Treatments</option>
                            <option value="bridal-special-occasions">Bridal & Special Occasions</option>
                            <option value="manicure-pedicure">Manicure & Pedicure</option>
                            <option value="eyebrow-lash-services">Eyebrow & Lash Services</option>
                        </select>
                        <input type="text" name="name" placeholder="Your Name" required>
                        <input type="email" name="email" placeholder="Your Email" required>
                        <input type="tel" name="phone" placeholder="Your Phone Number" required>
                        <input type="text" name="address" placeholder="Your Address" required>
                        <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                        <button type="submit" class="btn" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 DEE SALON. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
